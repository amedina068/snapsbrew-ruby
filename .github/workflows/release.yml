name: Release

# This workflow runs only by hand. It builds the gem and keeps it as an
# artifact. It does not publish the gem.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ruby/setup-ruby@78c62f2208e480ce3d5ae4dfd9b9e181acf48b63 # v1.344.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bin/rake test test:rails
      - run: gem build snapsbrew.gemspec
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapsbrew-gem
          path: "*.gem"

      # To publish later, add the repository secret RUBYGEMS_API_KEY and enable this step.
      # - name: Publish to RubyGems
      #   run: gem push *.gem
      #   env:
      #     GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
